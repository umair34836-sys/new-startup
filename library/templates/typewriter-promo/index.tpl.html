<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      :root { --ground: #0a0405; --ink: #fff4ec; --muted: #d6c2b8; --fire: #ff7a1f; --red: #ff4d5e; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--ink);
        font-family: "JetBrains Mono", monospace;
        background: radial-gradient(ellipse 60% 55% at 28% 50%, #2c0d06 0%, #140605 55%, #070304 100%); }
      #brand { position: absolute; left: 96px; top: 64px; display: flex; align-items: center; gap: 18px;
        font: 700 28px "Inter", sans-serif; letter-spacing: .18em; color: var(--muted); }
      #brand img { width: 64px; height: 64px; }
      #site { position: absolute; right: 96px; bottom: 60px; font: 500 26px "JetBrains Mono", monospace; color: #9c8378; }
      #glow { position: absolute; left: -200px; top: 140px; width: 1100px; height: 800px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,122,31,.20), rgba(255,122,31,0) 65%); }
      .card { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; align-items: center; }
      .inner { position: relative; margin-left: 200px; width: 1520px; }
      .k { font: 700 32px "Inter", sans-serif; letter-spacing: .28em; color: var(--fire); margin-bottom: 28px; }
      .h { font-size: 96px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
      .s { margin-top: 26px; font-size: 44px; line-height: 1.3; font-weight: 500; color: var(--muted); }
      .ch { display: none; }
      .acc { color: var(--fire); }
      .red { color: var(--red); }
      .caret { display: inline-block; width: 0.55em; height: 0.12em; margin-left: 4px; background: var(--fire);
        vertical-align: baseline; opacity: 0; }
      .biglogo { width: 220px; height: 220px; display: block; margin-bottom: 30px; filter: drop-shadow(0 16px 40px rgba(255,122,31,.45)); }
      .powers { position: absolute; left: 0; top: 330px; display: flex; gap: 22px; }
      .pw { width: 118px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .pw img { width: 118px; height: 118px; border-radius: 18px; border: 2px solid rgba(255,122,31,.55);
        box-shadow: 0 10px 26px rgba(0,0,0,.55); }
      .pw span { font: 600 22px "JetBrains Mono", monospace; color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">
      <div id="glow"></div>
      <div id="brand"><img src="assets/logo-512.png" alt="" />FIRECRAFT SMP</div>
      <div id="site">www.firecraft.fun</div>
      {{CARDS}}
      <audio id="typing" class="clip" src="assets/sfx/typing-track.wav" data-start="0" data-duration="{{TOTAL}}" data-track-index="3" data-volume="0.9"></audio>
      <audio id="music" class="clip" src="assets/music/ultimate-power.mp3" data-start="0" data-media-start="1.0" data-duration="{{MUSIC_DUR}}" data-track-index="4" data-volume="0.22" data-fade-in="0.5" data-fade-out="2.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      {{JS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
