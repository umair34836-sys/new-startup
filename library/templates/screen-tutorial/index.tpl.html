<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title1","type":"string","label":"Title","default":"FIRECRAFT"},{"id":"title2","type":"string","label":"Subtitle","default":"Whitelist kaise apply karein"},{"id":"url","type":"string","label":"End card URL","default":"www.firecraft.fun"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      :root {
        --ground: #0b0506;
        --ink: #fff4ec;
        --fire: #ff6a1a;
        --fire2: #ffb22e;
        --muted: #c9b3a8;
        --font-display: "Archivo Black";
        --font-body: "Inter";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      body, #root { font-family: "Inter", sans-serif; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: var(--ink); }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #screen { object-fit: contain; }
      .card { background: radial-gradient(ellipse 70% 60% at 50% 45%, #3a1206 0%, #170605 55%, #070304 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .glow { position: absolute; left: 660px; top: 120px; width: 600px; height: 600px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,106,26,.35), rgba(255,106,26,0) 70%); }
      .logo { width: 260px; height: 260px; position: relative; filter: drop-shadow(0 18px 40px rgba(255,106,26,.45)); }
      .kicker { margin-top: 34px; font: 700 30px "Inter", sans-serif; letter-spacing: .32em; color: var(--fire); position: relative; }
      .t1 { margin-top: 18px; font-size: 104px; line-height: 1; font-weight: 400; font-family: "Archivo Black", sans-serif; letter-spacing: -.01em; position: relative; }
      .t1 b { color: var(--fire); font-weight: 400; }
      .t2 { margin-top: 26px; font: 600 54px "Inter", sans-serif; color: var(--ink); position: relative; }
      .url { margin-top: 30px; font: 700 64px "Inter", sans-serif; color: var(--fire2); position: relative; }
      .cta { margin-top: 34px; padding: 20px 46px; border-radius: 999px; font: 700 38px "Inter", sans-serif; position: relative;
        background: linear-gradient(90deg, #ff5a12, #ff8a1e); color: #fff; box-shadow: 0 12px 40px rgba(255,106,26,.45); }
      .step { position: absolute; left: 36px; bottom: 60px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
      .step .num { padding: 12px 22px; border-radius: 14px; background: #c2410c; color: #fff; font: 800 30px "Inter", sans-serif; letter-spacing: .08em;
        box-shadow: 0 8px 30px rgba(0,0,0,.5); }
      .step .lbl { padding: 12px 26px; border-radius: 14px; background: rgba(12,6,6,.88); border: 2px solid rgba(255,138,30,.6);
        font: 700 30px "Inter", sans-serif; color: var(--ink); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
      .info { position: absolute; right: 70px; top: 330px; padding: 26px 40px; border-radius: 22px; background: rgba(12,6,6,.92);
        border: 3px solid var(--fire2); display: flex; flex-direction: column; align-items: center; box-shadow: 0 14px 40px rgba(0,0,0,.6); }
      .info .big { font-size: 92px; line-height: 1; font-weight: 400; font-family: "Archivo Black", sans-serif; color: var(--fire2); }
      .info .sm { margin-top: 10px; font: 700 34px "Inter", sans-serif; color: var(--ink); }
      .hl { position: absolute; }
      .hl .ring { position: absolute; inset: -6px; border: 5px solid var(--fire2); border-radius: 14px;
        box-shadow: 0 0 0 9999px rgba(0,0,0,.35), 0 0 30px rgba(255,178,46,.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">
      <div id="title" class="clip full card" data-start="0" data-duration="{{TITLE}}" data-track-index="1" data-track-kind="graphics">
        <div class="glow"></div>
        <img id="title-logo" class="logo" src="assets/logo-512.png" alt="FireCraft SMP logo" />
        <div id="title-kicker" class="kicker">TUTORIAL</div>
        <div id="title-t1" class="t1"><span data-var-text="title1">FIRECRAFT</span> <b>SMP</b></div>
        <div id="title-t2" class="t2" data-var-text="title2">Whitelist kaise apply karein</div>
      </div>
      <video id="screen" class="clip full" src="assets/screen.mp4" muted playsinline data-start="{{SCREEN_START}}" data-duration="{{SCREEN_DUR}}" data-track-index="0"></video>
{{STEPS}}
{{HLS}}
      <div id="endcard" class="clip full card" data-start="{{END_START}}" data-duration="{{END_DUR}}" data-track-index="1" data-track-kind="graphics">
        <div class="glow"></div>
        <img id="end-logo" class="logo" src="assets/logo-512.png" alt="FireCraft SMP logo" />
        <div id="end-t2" class="t2">Whitelist apply karein</div>
        <div id="end-url" class="url" data-var-text="url">www.firecraft.fun</div>
        <div id="end-cta" class="cta">⚡ Apply for Whitelist</div>
      </div>
      <audio id="vo" class="clip" src="assets/vo.wav" data-start="0" data-duration="{{TOTAL}}" data-track-index="2" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/music/lofi-chill--komiku--chill-out-theme.mp3" data-start="0" data-duration="{{MUSIC_DUR}}" data-track-index="3" data-volume="0.13" data-fade-in="1" data-fade-out="2"></audio>
{{CLICKS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#title-logo", { scale: 0.85, duration: 0.8, ease: "back.out(1.6)" }, 0);
      tl.from("#title-kicker, #title-t1, #title-t2", { y: 24, duration: 0.6, stagger: 0.1, ease: "power3.out" }, 0);
      tl.to("#title-logo", { y: -10, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0);
      tl.to("#title > *", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, {{TITLE}} - 0.4);
      tl.from("#screen", { opacity: 0, duration: 0.4, ease: "power1.out" }, {{SCREEN_START}});
{{STEP_JS}}
{{HL_JS}}
      tl.from("#end-logo", { scale: 0.6, opacity: 0, duration: 0.6, ease: "back.out(1.6)" }, {{END_START}} + 0.05);
      tl.from("#end-t2, #end-url, #end-cta", { y: 40, opacity: 0, duration: 0.55, stagger: 0.12, ease: "power3.out" }, {{END_START}} + 0.25);
      tl.fromTo("#end-cta", { scale: 1 }, { scale: 1.06, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, {{END_START}} + 1.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
